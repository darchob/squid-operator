# permissions for end users to edit squidconfigs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "squid-operator.labels" . | nindent 4 }}
  name: {{ include "squid-operator.fullname" . }}-squidconfigs-editor-role
rules:
- apiGroups:
  - squid.cdk.clara.net
  resources:
  - squidconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - squid.cdk.clara.net
  resources:
  - squidconfigs/status
  verbs:
  - get

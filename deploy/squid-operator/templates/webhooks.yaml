  clientConfig:
    service:
      name: {{ include "squid-operator.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-squid-cdk-clara-net-v1-squidconfigs
  failurePolicy: Fail
  name: vsquidconfigs.kb.io
  rules:
  - apiGroups:
    - squid.cdk.clara.net
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - squidconfigs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "squid-operator.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-squid-cdk-clara-net-v1-squidinstance
  failurePolicy: Fail
  name: vsquidinstance.kb.io
  rules:
  - apiGroups:
    - squid.cdk.clara.net
    apiVersions:
    - v1
    operations:
    - CREATE

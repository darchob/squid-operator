apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "squid-operator.labels" . | nindent 4 }}
  name: {{ include "squid-operator.fullname" . }}-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "squid-operator.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "squid-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

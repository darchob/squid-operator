apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    {{- include "squid-operator.labels" . | nindent 4 }}
  name: {{ include "squid-operator.fullname" . }}-serving-cert  # this name should match the one appeared in kustomizeconfig.yaml
spec:
  # SERVICE_NAME and SERVICE_NAMESPACE will be substituted by kustomize
  dnsNames:
  - {{ include "squid-operator.fullname" . }}-metrics-service.{{ .Release.Namespace }}.svc
  - {{ include "squid-operator.fullname" . }}-metrics-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: clusterIssuer
    name: selfsigned-issuer
  secretName: squid-webhook-server-cert # this secret will not be prefixed, since it's not managed by kustomize

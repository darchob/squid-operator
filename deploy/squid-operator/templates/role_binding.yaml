apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
     {{- include "squid-operator.labels" . | nindent 4 }}
  name: {{ include "squid-operator.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "squid-operator.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "squid-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

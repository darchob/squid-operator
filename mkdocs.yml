site_name: Squid Operator
site_description: Kubernetes Squid Proxy Operator

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - search.share
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/gitlab

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.arithmatex
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - admonition
  - footnotes
  - meta
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: getting-started/quickstart.md
      - Basic Usage: user-guide/basic-usage.md
  - Architecture:
      - Overview: architecture/overview.md
      - Components: architecture/components.md
      - Workflow: architecture/workflow.md
  - User Guide:
      - Configuration: user-guide/configuration.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Reference:
      - API Reference: reference/api.md
      - CRDs: reference/crds.md
      - Examples: reference/examples.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Release Process: development/release.md
      - Security: development/security.md

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/gitlab
      link: https://git.fr.clara.net/claranet/healthcare/buildops/projects/kubernetes/operators/squid-operator
  analytics:
    provider: google
    property: UA-XXXXXXXXX-X

plugins:
  - search
  - mike:
      alias: latest
      version_selector: true
      canonical_version: latest
